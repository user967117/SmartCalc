<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalc - Головна</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-3" href="index.html">SmartCalc</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link active" href="index.html">Калькулятор</a>
                    <a class="nav-link" href="about.html">Про додаток</a>
                    <a class="nav-link" href="profile.html">Профіль</a>
                    <a class="nav-link" href="login.html">Вхід</a>
                    <a class="nav-link" href="register.html">Реєстрація</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5 col-xl-4">
                <div class="calc-card">
                    <ul class="nav nav-calc-mode" id="calcTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#std">Standard</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#prog">Programmer</button>
                        </li>
                    </ul>
                    
                    <div class="display">0</div>

                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="std">
                            <div class="row g-1 row-cols-4 mt-2">
                                <div class="col"><button class="calc-btn btn-op">C</button></div>
                                <div class="col"><button class="calc-btn btn-op">⌫</button></div>
                                <div class="col"><button class="calc-btn btn-op">%</button></div>
                                <div class="col"><button class="calc-btn btn-op">÷</button></div>
                                <div class="col"><button class="calc-btn btn-num">7</button></div>
                                <div class="col"><button class="calc-btn btn-num">8</button></div>
                                <div class="col"><button class="calc-btn btn-num">9</button></div>
                                <div class="col"><button class="calc-btn btn-op">×</button></div>
                                <div class="col"><button class="calc-btn btn-num">4</button></div>
                                <div class="col"><button class="calc-btn btn-num">5</button></div>
                                <div class="col"><button class="calc-btn btn-num">6</button></div>
                                <div class="col"><button class="calc-btn btn-op">−</button></div>
                                <div class="col"><button class="calc-btn btn-num">1</button></div>
                                <div class="col"><button class="calc-btn btn-num">2</button></div>
                                <div class="col"><button class="calc-btn btn-num">3</button></div>
                                <div class="col"><button class="calc-btn btn-op">+</button></div>
                                <div class="col"><button class="calc-btn btn-num">+/-</button></div>
                                <div class="col"><button class="calc-btn btn-num">0</button></div>
                                <div class="col"><button class="calc-btn btn-num">.</button></div>
                                <div class="col"><button class="calc-btn btn-eq">=</button></div>
                            </div>
                        </div>

                        <div class="tab-pane fade" id="prog">
                            <div class="mb-3 mt-2" style="font-size: 0.9rem;">
                                <div class="d-flex justify-content-between text-secondary mb-1"><span class="fw-bold">HEX</span><span>0</span></div>
                                <div class="d-flex justify-content-between text-info border-start border-info border-3 ps-2 mb-1"><span class="fw-bold text-white">DEC</span><span class="text-white">0</span></div>
                                <div class="d-flex justify-content-between text-secondary mb-1"><span class="fw-bold">OCT</span><span>0</span></div>
                                <div class="d-flex justify-content-between text-secondary mb-1"><span class="fw-bold">BIN</span><span>0</span></div>
                            </div>
                            
                            <div class="row g-1 row-cols-5">
                                <div class="col"><button class="calc-btn btn-op text-secondary">A</button></div>
                                <div class="col"><button class="calc-btn btn-op"><<</button></div>
                                <div class="col"><button class="calc-btn btn-op">>></button></div>
                                <div class="col"><button class="calc-btn btn-op">C</button></div>
                                <div class="col"><button class="calc-btn btn-op">⌫</button></div>
                                <div class="col"><button class="calc-btn btn-op text-secondary">B</button></div>
                                <div class="col"><button class="calc-btn btn-num">7</button></div>
                                <div class="col"><button class="calc-btn btn-num">8</button></div>
                                <div class="col"><button class="calc-btn btn-num">9</button></div>
                                <div class="col"><button class="calc-btn btn-op">×</button></div>
                                <div class="col"><button class="calc-btn btn-op text-secondary">C</button></div>
                                <div class="col"><button class="calc-btn btn-num">4</button></div>
                                <div class="col"><button class="calc-btn btn-num">5</button></div>
                                <div class="col"><button class="calc-btn btn-num">6</button></div>
                                <div class="col"><button class="calc-btn btn-op">−</button></div>
                                <div class="col"><button class="calc-btn btn-op text-secondary">D</button></div>
                                <div class="col"><button class="calc-btn btn-num">1</button></div>
                                <div class="col"><button class="calc-btn btn-num">2</button></div>
                                <div class="col"><button class="calc-btn btn-num">3</button></div>
                                <div class="col"><button class="calc-btn btn-op">+</button></div>
                                <div class="col"><button class="calc-btn btn-op text-secondary">E</button></div>
                                <div class="col"><button class="calc-btn btn-op text-secondary">F</button></div>
                                <div class="col"><button class="calc-btn btn-num">0</button></div>
                                <div class="col"><button class="calc-btn btn-num">.</button></div>
                                <div class="col"><button class="calc-btn btn-eq">=</button></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center">
        <div class="container">
            <p class="mb-1 fw-bold">SmartCalc App</p>
            <p class="mb-0">Лабораторна робота №2 | 2026</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>
</body>
</html>
