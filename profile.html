<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalc - Профіль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-3" href="index.html">SmartCalc</a>
            <div class="navbar-nav ms-auto" id="nav-links"></div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div id="profile-content" class="card p-4 shadow-sm border-0">
                    <h3 class="mb-4 text-center fw-bold">Профіль користувача</h3>
                    <table class="table table-bordered">
                        <tr><th class="table-dark">Параметр</th><th class="table-dark">Значення</th></tr>
                        <tr><td>Ім'я</td><td id="prof-name">-</td></tr>
                        <tr><td>Email</td><td id="prof-email">-</td></tr>
                        <tr><td>Стать</td><td id="prof-gender">-</td></tr>
                        <tr><td>Дата народження</td><td id="prof-date">-</td></tr>
                    </table>
                </div>
                <div id="login-alert" class="alert alert-warning text-center d-none">
                    Будь ласка, увійдіть у систему, щоб переглянути профіль.
                </div>
            </div>
        </div>
    </main>
    <script src="app.js" defer></script>
</body>
</html>
