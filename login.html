<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalc - Вхід</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-3" href="index.html">SmartCalc </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Калькулятор</a>
                    <a class="nav-link" href="about.html">Про додаток</a>
                    <a class="nav-link" href="profile.html">Профіль</a>
                    <a class="nav-link active" href="login.html">Вхід</a>
                    <a class="nav-link" href="register.html">Реєстрація</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card card-custom p-4 text-center">
                    <h3 class="mb-4 fw-bold">Вхід</h3>
                    <form>
                        <div class="mb-3 text-start">
                            <label class="form-label fw-medium">Email</label>
                            <input type="email" class="form-control form-control-lg" placeholder="ivan@email.com">
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label fw-medium">Пароль</label>
                            <input type="password" class="form-control form-control-lg" placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm">Увійти</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center">
        <div class="container">
            <p class="mb-1 fw-bold">SmartCalc App</p>
            <p class="mb-0">Лабораторна робота №1 | 2026</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
