<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalc - Вхід</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-3" href="index.html">SmartCalc</a>
            <div class="navbar-nav ms-auto" id="nav-links">
                <a class="nav-link active" href="login.html">Вхід</a>
                <a class="nav-link" href="register.html">Реєстрація</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card p-4 shadow-sm border-0 text-center">
                    <h3 class="mb-4 fw-bold">Вхід</h3>
                    <form id="login-form">
                        <div class="mb-3 text-start">
                            <label class="form-label">Email</label>
                            <input type="email" id="log-email" class="form-control" placeholder="ivan@email.com" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label">Пароль</label>
                            <input type="password" id="log-pass" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Увійти</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>
</body>
</html>
