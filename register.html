<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalc - Реєстрація</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-3" href="index.html">SmartCalc</a>
            <div class="navbar-nav ms-auto" id="nav-links">
                <a class="nav-link" href="login.html">Вхід</a>
                <a class="nav-link active" href="register.html">Реєстрація</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4 shadow-sm border-0">
                    <h3 class="mb-4 text-center fw-bold">Реєстрація</h3>
                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label">Ім'я</label>
                            <input type="text" id="reg-name" class="form-control" placeholder="Іван Іванов" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="reg-email" class="form-control" placeholder="name@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" id="reg-pass" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label d-block">Стать</label>
                            <input type="radio" name="gender" value="Чоловіча" checked> Чоловіча
                            <input type="radio" name="gender" value="Жіноча" class="ms-3"> Жіноча
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Дата народження</label>
                            <input type="date" id="reg-date" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Зареєструватися</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>
</body>
</html>
