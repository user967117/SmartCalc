<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalc - Реєстрація</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-3" href="index.html">SmartCalc</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Калькулятор</a>
                    <a class="nav-link" href="about.html">Про додаток</a>
                    <a class="nav-link" href="profile.html">Профіль</a>
                    <a class="nav-link" href="login.html">Вхід</a>
                    <a class="nav-link active" href="register.html">Реєстрація</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-custom p-4">
                    <h3 class="mb-4 text-center fw-bold">Реєстрація</h3>
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Ім'я</label>
                            <input type="text" class="form-control form-control-lg" placeholder="Іван Іванов" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Email</label>
                            <input type="email" class="form-control form-control-lg" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium d-block">Стать</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="m" required>
                                <label class="form-check-label" for="m">Чоловіча</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="f">
                                <label class="form-check-label" for="f">Жіноча</label>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium">Дата народження</label>
                            <input type="date" class="form-control form-control-lg">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Зареєструватися</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center">
        <div class="container">
            <p class="mb-1 fw-bold">SmartCalc App</p>
            <p class="mb-0">Лабораторна робота №1 | 2026</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
